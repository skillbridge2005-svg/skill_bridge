name: skill_bridge

description: "A new Flutter project."

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  video_player: ^2.14.0
  razorpay_flutter: ^1.4.7
  cloud_functions: ^6.5.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3
  font_awesome_flutter: ^11.0.0
  google_sign_in: ^7.2.0
  flutter_svg: ^2.2.3
  youtube_player_iframe: ^6.0.2
  image_picker: ^1.2.4
  record: ^7.1.2
  audioplayers: ^6.8.1
  flutter_webrtc: ^1.6.2+hotfix.4
  path_provider: ^2.1.6
  supabase_flutter: ^2.18.3
  flutter_dotenv: ^6.0.0
  firebase_storage: ^13.6.1
  flutter_markdown: ^0.7.7+1
  path: ^1.9.1
  file_picker: ^13.3.0
  cached_network_image: ^4.0.5
  fl_chart: ^1.3.0
  vector_math: ^2.4.3
  pdf: ^3.13.1
  printing: ^5.15.1
  firebase_messaging: ^16.7.1
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/skillbridge_logo.png
    - assets/images/developer.gif
    - assets/images/google_logo_light.svg
    - assets/images/google_logo_dark.svg
    - assets/images/google_logo_light.png
    - assets/images/google_logo_dark.png
    - assets/images/chat_background.png.jpeg

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/skillbridge_logo.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/skillbridge_logo.png"

  adaptive_icon_foreground_inset: 31

  min_sdk_android: 21
